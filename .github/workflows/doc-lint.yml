name: doc-lint
on:
  push:
    branches: [master]
  pull_request:

jobs:
  doc-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run doc-set drift lint
        run: python tools/doc-lint.py
